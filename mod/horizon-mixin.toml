[mod]
id = "horizon_voice"
version = "0.3.3"
priority = 100

[compatibility]
# Horizon Nightly 2026-11-01 (4aa6854).
horizon_revision = "4aa6854a886183440256f4f4a4a9d1ed853227a1"

# The glue between the game and the engine crate, inside `crate::game` so it
# reaches the game's own state.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "horizon_voice"
source = "runtime.rs"

# Every packet from the server: the voicechat:* plugin messages, and Login (a
# server joined). Horizon has no hook point for plugin messages yet.
[[injection]]
id = "packet"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::handle_packet"
helper = "packet.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "packet", ty = "&horizon_protocol::packets::play::Clientbound", value = "&packet" },
]

[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "frame.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "key"
hook = "key"
hook_version = 1
kind = "HEAD"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "hud"
hook = "hud"
hook_version = 1
kind = "HEAD"
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

# Options > Mods: the mod's row with its keys, its settings page and clicks.
[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

# /vgroup: groups by name, with passwords.
[[injection]]
id = "commands"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_commands"
helper = "commands.rs"
bindings = [{ name = "commands", ty = "&mut Vec<&'static str>", value = "&mut *commands" }]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

# Network, codec and sound card: built once, apart from the game crate.
[[crate]]
id = "engine"
path = "engine"
